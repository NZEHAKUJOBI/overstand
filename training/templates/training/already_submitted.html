{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Already Submitted</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { margin:0; font-family:'Segoe UI',Arial,sans-serif; background:#f4f7f4; display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .card { background:#fff; border-radius:16px; padding:48px 40px; max-width:440px; width:100%; text-align:center; margin:24px; box-shadow:0 8px 32px rgba(0,0,0,0.1); }
  .icon { width:70px;height:70px;background:#dbeafe;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px; }
  .icon i { font-size:1.75rem; color:#1e40af; }
  h1 { font-size:1.5rem; font-weight:800; color:#111827; margin-bottom:12px; }
  p { color:#6b7280; line-height:1.7; }
  [data-lang] { display:none; } [data-lang].lang-active { display:inline; }
</style>
</head>
<body>
<div class="card">
  <div class="icon"><i class="fas fa-info-circle"></i></div>
  <h1>
    <span data-lang="en" class="lang-active">Already Submitted</span>
    <span data-lang="fr">Déjà soumis</span>
    <span data-lang="pt">Já submetido</span>
  </h1>
  <p>
    <span data-lang="en" class="lang-active">You have already completed the {{ phase }}-training form. Thank you!</span>
    <span data-lang="fr">Vous avez déjà rempli le formulaire {{ phase }}-formation. Merci !</span>
    <span data-lang="pt">Já preencheu o formulário {{ phase }}-formação. Obrigado!</span>
  </p>
</div>
<script>
const l = localStorage.getItem('ipawas_lang') || 'en';
document.querySelectorAll('[data-lang]').forEach(el => el.classList.toggle('lang-active', el.dataset.lang === l));
</script>
</body>
</html>
