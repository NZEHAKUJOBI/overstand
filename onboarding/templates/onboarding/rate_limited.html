<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPAWAS — Too Many Requests</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #f0faf5 0%, #e8f4f8 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: white; border-radius: 20px; box-shadow: 0 8px 40px rgba(0,0,0,0.10);
    width: 100%; max-width: 420px; text-align: center; padding: 48px 40px;
  }
  .icon {
    width: 72px; height: 72px; background: #fee2e2; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;
  }
  h1 { font-size: 1.3rem; font-weight: 800; color: #111827; margin-bottom: 12px; }
  p { color: #6b7280; font-size: 0.9rem; line-height: 1.7; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">
    <svg width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="#dc2626" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/>
    </svg>
  </div>
  <h1>Too Many Requests</h1>
  <p>You have submitted too many requests in a short period. Please wait a while before trying again.</p>
  <p style="margin-top:12px;font-size:0.8rem;color:#9ca3af;">IPAWAS · Investment Promotion Agencies of West Africa</p>
</div>
</body>
</html>
