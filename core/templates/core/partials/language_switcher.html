{% load i18n %}

<form action="{% url 'set_language' %}" method="post" class="d-flex align-items-center">
    {% csrf_token %}
    <input name="next" type="hidden" value="{{ request.get_full_path }}">
    
    <div class="dropdown">
        <button class="nav-link dropdown-toggle d-flex align-items-center bg-transparent border-0" type="button" id="languageDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fas fa-globe me-2"></i>
            {% get_current_language as LANGUAGE_CODE %}
            {{ LANGUAGE_CODE|upper }}
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow border-0" aria-labelledby="languageDropdown" style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);">
            {% get_available_languages as LANGUAGES %}
            {% for lang_code, lang_name in LANGUAGES %}
            {% get_language_info for lang_code as lang %}
            <li>
                <button type="submit" name="language" value="{{ lang.code }}" class="dropdown-item d-flex justify-content-between align-items-center {% if lang.code == LANGUAGE_CODE %}active bg-success text-white{% else %}text-dark{% endif %}">
                    <span>{{ lang.name_local }}</span>
                    <span class="ms-3 text-uppercase small opacity-75">{{ lang.code }}</span>
                </button>
            </li>
            {% endfor %}
        </ul>
    </div>
</form>
