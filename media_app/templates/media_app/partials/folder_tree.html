{% load static %}
{% load i18n %}

{% if folder_tree %}
<div class="list-group list-group-flush">
    {% for node in folder_tree %}
        {% include "media_app/partials/folder_tree_item.html" with node=node depth=0 %}
    {% endfor %}
</div>
{% else %}
<div class="p-3 text-center text-muted">
    <i class="fas fa-folder-open"></i>
    <p class="mb-0 mt-2 small">{% translate "No folders yet" %}</p>
</div>
{% endif %}
