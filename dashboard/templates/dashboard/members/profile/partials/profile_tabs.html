{% load i18n %}
<!-- Profile Navigation Tabs -->
<div class="profile-tabs-wrapper mb-4">
    <ul class="profile-tabs" role="tablist">
        <li class="profile-tab">
            <a href="{% url 'dashboard:country:profile' member_state.slug %}"
               class="profile-tab-link {% if active == 'overview' %}active{% endif %}">
                <i class="fas fa-eye"></i>
                <span>{% translate "Overview" %}</span>
            </a>
        </li>
        <li class="profile-tab">
            <a href="{% url 'dashboard:country:profile_basic' member_state.slug %}"
               class="profile-tab-link {% if active == 'basic' %}active{% endif %}">
                <i class="fas fa-info-circle"></i>
                <span>{% translate "Basic Info" %}</span>
            </a>
        </li>
        <li class="profile-tab">
            <a href="{% url 'dashboard:country:profile_economic' member_state.slug %}"
               class="profile-tab-link {% if active == 'economic' %}active{% endif %}">
                <i class="fas fa-chart-line"></i>
                <span>{% translate "Economic Data" %}</span>
            </a>
        </li>
        <li class="profile-tab">
            <a href="{% url 'dashboard:country:profile_incentives' member_state.slug %}"
               class="profile-tab-link {% if active == 'incentives' %}active{% endif %}">
                <i class="fas fa-tags"></i>
                <span>Incentives</span>
            </a>
        </li>
        <li class="profile-tab">
            <a href="{% url 'dashboard:country:profile_resources' member_state.slug %}"
               class="profile-tab-link {% if active == 'resources' %}active{% endif %}">
                <i class="fas fa-file-alt"></i>
                <span>{% translate "Resources" %}</span>
            </a>
        </li>
        <li class="profile-tab">
            <a href="{% url 'dashboard:country:profile_media' member_state.slug %}"
               class="profile-tab-link {% if active == 'media' %}active{% endif %}">
                <i class="fas fa-images"></i>
                <span>{% translate "Media Gallery" %}</span>
            </a>
        </li>
        <li class="profile-tab">
            <a href="{% url 'dashboard:country:profile_seo' member_state.slug %}"
               class="profile-tab-link {% if active == 'seo' %}active{% endif %}">
                <i class="fas fa-search"></i>
                <span>{% translate "SEO Settings" %}</span>
            </a>
        </li>
    </ul>
</div>
